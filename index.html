<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit - Job Application Tracker | Land Your Dream Job</title>
    <meta name="description" content="Stop losing track of job applications. Orbit keeps every job, every contact, and every deadline organized — from first apply to final offer." />
    <meta name="keywords" content="job tracker, job application tracker, career management, interview tracker, ATS, job search organizer" />
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Orbit - Job Application Tracker" />
    <meta property="og:description" content="Stop losing track of job applications. Orbit keeps every job, every contact, and every deadline organized." />
    <meta property="og:url" content="https://orbit.jobs" />
    <meta property="og:site_name" content="Orbit" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Orbit - Job Application Tracker" />
    <meta name="twitter:description" content="Stop losing track of job applications. Orbit keeps every job organized." />
    
    <!-- Canonical -->
    <link rel="canonical" href="https://orbit.jobs" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Orbit",
      "description": "Job application tracker that keeps every job, contact, and deadline organized.",
      "url": "https://orbit.jobs",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "247"
      }
    }
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Preload critical headline font (Manrope) for LCP improvement -->
    <link 
      rel="preload" 
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=Manrope:wght@600;700;800&display=swap" 
      fetchpriority="high"
    />
    <link 
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=Manrope:wght@600;700;800&display=swap" 
      rel="stylesheet" 
      media="print" 
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
